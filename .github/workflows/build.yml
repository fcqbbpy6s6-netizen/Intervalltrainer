name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests und unsignierte IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Versionen anzeigen
        run: |
          xcodebuild -version
          swift --version

      - name: Unit-Tests (IntervalCore)
        run: swift test --package-path Packages/IntervalCore

      - name: XcodeGen installieren
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          xcodebuild \
            -project Intervalltrainer.xcodeproj \
            -scheme Intervalltrainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        run: |
          APP="build/Build/Products/Release-iphoneos/Intervalltrainer.app"
          test -d "$APP"
          rm -rf Payload Intervalltrainer.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Intervalltrainer.ipa Payload
          ls -lh Intervalltrainer.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Intervalltrainer-ipa
          path: Intervalltrainer.ipa
          if-no-files-found: error
          retention-days: 30
